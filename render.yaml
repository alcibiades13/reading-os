services:
  # PostgreSQL Database
  - type: pserv
    name: reading-os-db
    plan: free
    databaseName: reading_os
    databaseUser: reading_os_user
    ipAllowList: []

  # Django Backend API
  - type: web
    name: reading-os-api
    runtime: python
    region: frankfurt  # Closest to Serbia
    plan: free
    branch: main
    rootDir: backend
    buildCommand: bash build.sh
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /api/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        sync: false  # You'll set this manually to include your Render domain
      - key: DATABASE_URL
        fromDatabase:
          name: reading-os-db
          property: connectionString
      - key: DB_NAME
        fromDatabase:
          name: reading-os-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: reading-os-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: reading-os-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: reading-os-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: reading-os-db
          property: port
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # You'll set this manually to include your frontend domain
      - key: MEDIA_URL
        value: /media/
      - key: MEDIA_ROOT
        value: media

  # Vue Frontend (Static Site)
  - type: web
    name: reading-os-frontend
    runtime: static
    region: frankfurt
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false  # You'll set this manually to point to your backend domain
